run_name: qwen3-4b-natural-nemotron-v3-80k-1epoch
model:
  id: $SOURCE_STUDY_MODEL_PATH
  revision: main
  family: nemotron
  tuning: lora
  attention: sdpa
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]
data:
  train: work/source-study-natural/nemotron_v3_9lang_natural/train.jsonl
  validation: work/source-study-natural/nemotron_v3_9lang_natural/validation.jsonl
  max_length: 2048
training:
  epochs: 1
  learning_rate: 1.0e-05
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  save_steps: 2500
  eval_steps: 2500
  save_total_limit: 2
  seed: 3407
output_dir: runs-source-study-natural/qwen3_4b/nemotron_v3_9lang_natural_80k_1epoch
