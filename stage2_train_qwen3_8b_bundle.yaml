run_name: qwen3-8b-stage2-gemini-policy
output_dir: runs-stage2/qwen3_8b/lora_phase2_gemini_policy

model:
  id: ${MODEL_PATH_STAGE1_MERGED}
  tokenizer_id: ${MODEL_PATH_STAGE1_MERGED}
  revision: null
  family: nemotron
  tuning: lora
  attention: sdpa
  trust_remote_code: false
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]

data:
  # Layout produced by scripts/unpack_stage2_bundle.py.
  train: work/stage2/full_gemini_bundle/data/train.jsonl
  validation: work/stage2/full_gemini_bundle/data/validation.jsonl
  max_length: 2048

training:
  epochs: 1
  learning_rate: 3.0e-06
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 3
  seed: 3407
