stage2:
  seed: 3407
  validation_fraction: 0.01
  # One deterministic language is retained per V3 upstream ID.
  v3_languages: [en, ar, de, es, fr, hi, ja, th, zh]

sources:
  # Paths are relative to this config. They may also contain environment variables.
  vi_gemini: ../data/final
  vi_luna_sol: ../data/final_luna_sol_pure_v1
  v3_root: ../offline-bundle-work/snapshots/nemotron-9lang
  reasoning_jsonl: input/stage2/reasoning/aegis_v2_efficient_reasoning.jsonl
  nemotron35_parquet: input/stage2/nemotron35/train.parquet
  # WildGuard is gated. Export the official wildguardtrain config to this JSONL.
  wildguardtrain_jsonl: input/stage2/wildguard/wildguardtrain.jsonl
  benchmark_test_paths:
    - work/benchmarks

source_revisions:
  nemotron_v3: a3f7ecb3433d1933701a83f18de16c36934a7f51
  wildguardmix: d29c47f41c8b51348b5c8e8c81c039b3132b66d1
  nemotron_content_safety_reasoning: 792b0715f519c0750d63b73af2bf33ddd9ac3887
  nemotron_3_5_content_safety: 841f5023b8db12b484180c6121bb10fcf400d1c3

training:
  # Fresh LoRA on a merged Stage-1 model. Point MODEL_PATH_QWEN3_8B to it.
  epochs: 1
  learning_rate: 3.0e-06
  # 4 x A30: 1 * 8 * 4 = effective global batch 32.
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 2048
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  save_steps: 500
  save_total_limit: 3
