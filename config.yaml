  output_dir: work/training
benchmarks:
  sea_root: input/sea-helm
  sea_revision: 9be3986d00185dc6d6ec362b71542ed29642a6be
  sea_output: work/sea/sea_safeguard_vi.jsonl
  xsafety_root: input/xsafety
  xsafety_revision: 8c55b6a6cda594cd550a4921513238a2dd40eb5a
  output_dir: work/benchmarks
  # XSafety languages matching paper Table 15 (harmful-F1): en ar de fr hi ja zh.
  # NOTE: paper Table 16 (harmful-recall) uses 9 langs (adds es, th).
  xsafety_languages:
  - en
  - ar
  - de
  - fr
  - hi
  - ja
  - zh
evaluation:
  backend: vllm
  gpu_memory_utilization: 0.6
  batch_size: 4
  vllm_chunk_size: 1000
  load_in_4bit: false
  likelihood_field: text
  likelihood_max_length: 2048
  likelihood_stride: 1024
training:
  common:
    max_length: 2048
    lr_scheduler_type: constant
    warmup_ratio: 0.0
    gradient_checkpointing: true
    logging_steps: 10
    save_steps: 500
    eval_steps: 500
    save_total_limit: 3
    seed: 3407
    smoke_max_steps: 3
    pilot_max_steps: 100
  lora:
    epochs: 5
    learning_rate: 1.0e-05
    per_device_batch_size: 4
    gradient_accumulation_steps: 8
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.05
  full:
    epochs: 1
    learning_rate: 1.0e-05
    per_device_batch_size: 1
    gradient_accumulation_steps: 32
